[workspace]
resolver = "2"
members = [
  "crates/ir",
  "crates/analysis",
  "crates/alloc",
  "crates/alloc_linear_scan",
  "crates/alloc_sim_anneal",
  "crates/codegen",
  "crates/runner",
  "crates/cli",
  "tools/viz",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
iced-x86 = { version = "1", features = ["code_asm"] }
smallvec = { version = "1", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
petgraph = "0.6"
tempfile = "3"
