name: Export humanize source

on:
  push:
    branches: [refactor/human-authored-style]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git --exclude=target -czf /tmp/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: humanize-source
          path: /tmp/source.tar.gz
          if-no-files-found: error
          retention-days: 1
