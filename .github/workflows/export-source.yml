name: Export source for review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Create source archive
        run: |
          tar --exclude=.git --exclude=target -czf /tmp/x86-64-codegen-ra-playground-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-tree
          path: /tmp/x86-64-codegen-ra-playground-source.tar.gz
          if-no-files-found: error
          retention-days: 1
