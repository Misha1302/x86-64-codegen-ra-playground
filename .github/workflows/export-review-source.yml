name: Export review source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: tar --exclude=.git --exclude=target -czf /tmp/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: /tmp/source.tar.gz
          if-no-files-found: error
          retention-days: 1
