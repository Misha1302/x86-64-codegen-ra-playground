name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Upload clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics
          path: clippy.log
          if-no-files-found: error
          retention-days: 1
      - name: Debug tests
        run: cargo test --workspace --all-targets
      - name: Release tests
        run: cargo test --workspace --all-targets --release
      - name: Differential smoke matrix
        run: |
          cargo run -p cli -- run --example basicblock --alloc linear-scan --regs 0
          cargo run -p cli -- run --example trace --alloc sim-anneal --regs 2
          cargo run -p cli -- run --example loop-sum --alloc linear-scan --regs 1
          cargo run -p cli -- run --example phi-swap-loop --alloc sim-anneal --regs 2
