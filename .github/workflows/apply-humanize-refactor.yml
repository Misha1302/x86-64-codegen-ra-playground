name: Apply human-authored refactor

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply prepared changes
        id: apply
        shell: bash
        run: |
          set +e
          {
            set -euxo pipefail
            cat humanize-update.part* | base64 -d > /tmp/humanize-update.tar.gz
            test "$(sha256sum /tmp/humanize-update.tar.gz | cut -d' ' -f1)" = "8f3874582df78b96eff4d21ec479b62523d064d2c362b6817f000c70979186cf"
            tar -xzf /tmp/humanize-update.tar.gz
            rm -f humanize-update.part*
            rm -f .github/workflows/apply-humanize-refactor.yml
            rm -f .github/workflows/export-humanize-source.yml
            cargo fmt --all
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'refactor: make code and documentation more author-driven'
            git push
          } > apply.log 2>&1
          status=$?
          cat apply.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanize-apply-log
          path: apply.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when application failed
        if: steps.apply.outputs.status != '0'
        run: exit 1
